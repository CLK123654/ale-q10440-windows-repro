name: windows-2025

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Windows business checks
        shell: pwsh
        run: npm run verify
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q10440-windows-evidence
          path: verification/evidence/
          if-no-files-found: error
          retention-days: 1
